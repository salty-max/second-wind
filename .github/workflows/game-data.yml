# Every day, and by hand: Second Wind's game data built again from wow-data's
# pins (salty-max/wow-data's addon-data.yml: wow-data beside it, the
# databases downloaded; addon-kit beside it): the creatures' portraits, every
# foe's name and every building area's in every language (English one of
# them), then the language files. When one
# changes, a pull request with the checks run, then merged by itself and told
# to the owner's phone.
name: Game data

on:
  schedule:
    - cron: "47 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # (ci.yml asked for on the pull request's branch, the gate before the merge)
  actions: write

jobs:
  data:
    uses: salty-max/wow-data/.github/workflows/addon-data.yml@main
    secrets:
      INBOX_EVENTS_TOKEN: ${{ secrets.INBOX_EVENTS_TOKEN }}
    with:
      kit: true
      generate: |
        bun scripts/creatures.ts
        bun scripts/game.ts
        for locale in $(ls i18n | grep -E '^[a-z]{2}[A-Z]{2}$'); do
          bun scripts/creature_names.ts "$locale"
          python3 ../addon-kit/subzones.py "$locale"
        done
        bun scripts/locales.ts
      paths: |
        i18n
        addon/SecondWind
